<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f7fa">
<title>SHAHALOM 420 | Video Library</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f1f5f8;--card:#fff;--text:#17191d;--muted:#707781;--line:#e1e6eb;--accent:#d21d70;--shadow:0 10px 28px #16202a12}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif}
body.dark{--bg:#11151b;--card:#1c232c;--text:#f4f6f8;--muted:#aab2bd;--line:#303945;--shadow:0 10px 28px #0005}
header{height:76px;background:var(--card);display:flex;align-items:center;justify-content:space-between;padding:0 22px;box-shadow:var(--shadow);position:sticky;top:0;z-index:5}
.brand{font-size:25px;font-weight:850;letter-spacing:-.5px}.brand span{color:#d21d2b}.actions{display:flex;gap:12px}
.iconbtn{border:0;background:transparent;color:var(--text);font-size:25px;width:44px;height:44px;border-radius:50%;cursor:pointer}
.wrap{max-width:760px;margin:auto;padding:10px 16px 36px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin:10px 0 26px;box-shadow:var(--shadow)}
.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:16px;background:#d8e0e8;display:block}
h2{font-size:20px;line-height:1.4;margin:14px 0 6px}.date{color:var(--muted);font-weight:600;font-size:14px}
.clock{color:#d21d2b;margin-right:8px}.empty{text-align:center;color:var(--muted);padding:35px}
.panel{display:none;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0}
.panel.show{display:block}.panel input,.panel button{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid var(--line);font:inherit}
.panel button,.watch{background:#17191d;color:white;border:0;font-weight:700;cursor:pointer}
.watch{padding:12px 18px;border-radius:12px;margin-top:12px}
.drawer{display:none;position:fixed;inset:0;background:#0008;z-index:10}.drawer.show{display:block}
.drawerbox{background:var(--card);height:100%;width:min(82%,330px);padding:24px}.drawerbox button{display:block;width:100%;padding:14px;text-align:left;background:none;border:0;color:var(--text);font-size:17px}
.modal{display:none;position:fixed;inset:0;background:#000d;z-index:20;align-items:center;justify-content:center;padding:16px}.modal.show{display:flex}.modalbox{background:var(--card);width:min(100%,700px);border-radius:18px;padding:14px}.modal iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px}.close{float:right;border:0;background:none;color:var(--text);font-size:25px}
small{color:var(--muted)}
</style>
</head>
<body>
<header>
  <button class="iconbtn" onclick="toggleMenu()" aria-label="Menu">☰</button>
  <div class="brand"><span>SHAHALOM</span> 420</div>
  <div class="actions"><button class="iconbtn" onclick="toggleTheme()" aria-label="Dark mode">☾</button></div>
</header>
<main class="wrap">
  <section id="admin" class="panel">
    <h3>Admin Panel — নতুন ভিডিও যোগ</h3>
    <input id="vtitle" placeholder="ভিডিওর নাম / Episode">
    <input id="vimage" placeholder="Thumbnail image URL">
    <input id="vlink" placeholder="YouTube video URL">
    <input id="vdate" placeholder="তারিখ (যেমন: 13 Nov, 2026)">
    <button onclick="addVideo()">ভিডিও যোগ করো</button>
    <small>এই ডেমোতে ভিডিওগুলো এই ব্রাউজারের Local Storage-এ সেভ হবে। আসল সবার জন্য Admin Panel করতে অনলাইন ডেটাবেস লাগবে।</small>
  </section>
  <div id="videos"></div>
</main>
<div id="drawer" class="drawer" onclick="if(event.target.id==='drawer')toggleMenu()">
 <div class="drawerbox">
  <h2>SHAHALOM 420</h2>
  <button onclick="showHome()">⌂ Home</button>
  <button onclick="document.getElementById('admin').classList.toggle('show');toggleMenu()">＋ Admin Panel</button>
  <button onclick="toggleTheme();toggleMenu()">☾ Dark Mode</button>
 </div>
</div>
<div id="modal" class="modal" onclick="if(event.target.id==='modal')closeVideo()">
 <div class="modalbox"><button class="close" onclick="closeVideo()">×</button><div id="player"></div></div>
</div>
<script>
const defaults=[
 {title:"গুলিয়াখালী সী বিচ | Blog-07",image:"",link:"https://www.youtube.com/",date:"3 weeks ago"},
 {title:"সীতাকুণ্ড পাহাড় ঘুরাঘুরি | Blog-06",image:"",link:"https://www.youtube.com/",date:"1 month ago"},
 {title:"জাতীয় নির্বাচন ২০২৬ | Blog-05",image:"",link:"https://www.youtube.com/",date:"3 months ago"}
];
let videos=JSON.parse(localStorage.getItem("sh420videos")||"null")||defaults;
function save(){localStorage.setItem("sh420videos",JSON.stringify(videos));render()}
function render(){const root=document.getElementById("videos");root.innerHTML="";
 if(!videos.length){root.innerHTML='<div class="empty">এখনো কোনো ভিডিও যোগ করা হয়নি</div>';return}
 videos.forEach((v,i)=>{const card=document.createElement("article");card.className="card";
 const img=document.createElement("img");img.className="thumb";img.alt=v.title;img.src=v.image||"https://placehold.co/800x450/263445/ffffff?text=SHAHALOM+420";
 const title=document.createElement("h2");title.textContent=v.title;
 const date=document.createElement("div");date.className="date";date.innerHTML='<span class="clock">●</span>';date.append(document.createTextNode(v.date||""));
 const btn=document.createElement("button");btn.className="watch";btn.textContent="Watch Now";btn.onclick=()=>openVideo(v.link);
 card.append(img,title,date,btn);root.append(card);
 })}
function addVideo(){const title=document.getElementById("vtitle").value.trim(),image=document.getElementById("vimage").value.trim(),link=document.getElementById("vlink").value.trim(),date=document.getElementById("vdate").value.trim();
 if(!title||!link){alert("ভিডিওর নাম ও লিংক দাও");return}videos.unshift({title,image,link,date:date||"নতুন"});save();["vtitle","vimage","vlink","vdate"].forEach(id=>document.getElementById(id).value="");alert("ভিডিও যোগ হয়েছে")}
function openVideo(url){let id=url.match(/(?:youtu\\.be\\/|youtube\\.com\\/(?:watch\\?v=|embed\\/|shorts\\/))([\\w-]{11})/);document.getElementById("player").innerHTML=id?'<iframe allowfullscreen src="https://www.youtube.com/embed/'+id[1]+'"></iframe>':'<p>ভিডিও লিংক:</p><a target="_blank" rel="noopener" href="'+url.replace(/"/g,"&quot;")+'">ভিডিও খুলুন</a>';document.getElementById("modal").classList.add("show")}
function closeVideo(){document.getElementById("modal").classList.remove("show");document.getElementById("player").innerHTML=""}
function toggleMenu(){document.getElementById("drawer").classList.toggle("show")}
function toggleTheme(){document.body.classList.toggle("dark");localStorage.setItem("sh420dark",document.body.classList.contains("dark")?"1":"0")}
function showHome(){document.getElementById("admin").classList.remove("show");toggleMenu()}
if(localStorage.getItem("sh420dark")==="1")document.body.classList.add("dark");
if(window.Telegram?.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand()}
render();
</script>
</body>
</html>
