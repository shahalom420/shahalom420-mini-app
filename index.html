<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHAHALOM 420</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f4f9;color:#172033}
header{background:#172554;color:white;padding:15px;display:flex;justify-content:space-between;align-items:center}
header h2{font-size:19px;margin:0}
button{border:0;border-radius:9px;padding:11px;cursor:pointer;font-weight:bold}
.menu{background:white;color:#172554}
.drawer{display:none;background:#1e3a8a;padding:12px}
.drawer.show{display:block}
.drawer button{margin:4px;background:white;color:#172554}
.balance{margin:14px;padding:14px;background:#dbeafe;border-radius:12px;color:#172554;font-weight:bold}
.container{padding:14px}
.videos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card,.panel{background:white;border-radius:13px;padding:11px;box-shadow:0 2px 8px #0001}
.thumb{width:100%;aspect-ratio:16/9;border-radius:9px;object-fit:cover;background:#1e3a8a}
.card h4{font-size:14px;min-height:34px}
.watch{width:100%;background:#2563eb;color:white}
.panel{display:none;margin-top:15px}
.panel.show{display:block}
input{width:100%;padding:12px;margin:7px 0;border:1px solid #ccc;border-radius:8px}
.add{background:#16a34a;color:white;width:100%}
.delete{background:#dc2626;color:white;width:100%;margin-top:7px}
.dark{background:#101827;color:white}
.dark .card,.dark .panel{background:#1e293b;color:white}
.dark input{background:#263449;color:white}
.dark .balance{background:#263b5b;color:white}
#modal{display:none;position:fixed;inset:0;background:#000e;z-index:5;align-items:center;justify-content:center;padding:15px}
#modal.show{display:flex}
.modalbox{background:white;padding:12px;border-radius:12px;width:100%;max-width:600px}
.modalbox iframe{width:100%;aspect-ratio:16/9;border:0}
.close{background:#dc2626;color:white;margin-top:10px;width:100%}
.empty{text-align:center;padding:20px}
footer{text-align:center;padding:20px;font-size:12px}
</style>
</head>
<body>

<header>
<button class="menu" onclick="toggleMenu()">☰</button>
<h2>SHAHALOM 420</h2>
<button class="menu" onclick="toggleDark()">🌙</button>
</header>

<div id="drawer" class="drawer">
<button onclick="showHome()">Home</button>
<button onclick="showAdmin()">Admin Panel</button>
<button onclick="toggleDark()">Dark Mode</button>
</div>

<div class="balance">🪙 Coin Balance: <span id="coins">0</span></div>

<main class="container">
<section id="home">
<h3>🎬 Video Library</h3>
<div id="videos" class="videos"></div>
</section>

<section id="admin" class="panel">
<h3>⚙️ Admin Panel</h3>
<input id="vtitle" placeholder="ভিডিওর নাম">
<input id="vlink" placeholder="YouTube Video Link">
<input id="vimage" placeholder="Thumbnail Image Link (ঐচ্ছিক)">
<button class="add" onclick="addVideo()">+ Add Video</button>
<p id="message"></p>
<h3>ভিডিও মুছুন</h3>
<div id="manage"></div>
</section>
</main>

<div id="modal">
<div class="modalbox">
<div id="player"></div>
<button class="close" onclick="closeVideo()">বন্ধ করুন</button>
</div>
</div>

<footer>© SHAHALOM 420</footer>

<script>
const defaults=[
{title:"গুলিয়াখালী সী বিচ | Blog-07",link:"https://www.youtube.com/@shahalom420",image:""},
{title:"সীতাকুণ্ড পাহাড় ঘুরাঘুরি | Blog-06",link:"https://www.youtube.com/@shahalom420",image:""}
];

let videos;
try{
videos=JSON.parse(localStorage.getItem("sh420videos"))||defaults;
}catch(e){
videos=defaults;
}

function save(){
localStorage.setItem("sh420videos",JSON.stringify(videos));
}

function render(){
const box=document.getElementById("videos");
const manage=document.getElementById("manage");
box.innerHTML="";
manage.innerHTML="";

if(videos.length===0){
box.innerHTML='<div class="empty">কোনো ভিডিও নেই</div>';
}

videos.forEach((v,i)=>{
const card=document.createElement("div");
card.className="card";

const img=document.createElement("img");
img.className="thumb";
img.alt=v.title;
img.src=v.image||getThumbnail(v.link);
img.onerror=()=>{img.style.display="none"};

const title=document.createElement("h4");
title.textContent=v.title;

const watch=document.createElement("button");
watch.className="watch";
watch.textContent="Watch Now";
watch.onclick=()=>openVideo(v.link);

card.append(img,title,watch);
box.appendChild(card);

const item=document.createElement("div");
item.className="card";
const name=document.createElement("p");
name.textContent=v.title;
const del=document.createElement("button");
del.className="delete";
del.textContent="Delete";
del.onclick=()=>deleteVideo(i);
item.append(name,del);
manage.appendChild(item);
});
}

function getVideoId(url){
const match=url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/);
return match?match[1]:"";
}

function getThumbnail(url){
const id=getVideoId(url);
return id?"https://img.youtube.com/vi/"+id+"/hqdefault.jpg":"";
}

function addVideo(){
const title=document.getElementById("vtitle").value.trim();
const link=document.getElementById("vlink").value.trim();
const image=document.getElementById("vimage").value.trim();

if(!title||!link){
alert("ভিডিওর নাম ও লিংক দিন");
return;
}

videos.unshift({title,link,image});
save();
render();

document.getElementById("vtitle").value="";
document.getElementById("vlink").value="";
document.getElementById("vimage").value="";
document.getElementById("message").textContent="ভিডিও যোগ হয়েছে!";
}

function deleteVideo(i){
if(confirm("ভিডিওটি মুছে ফেলবেন?")){
videos.splice(i,1);
save();
render();
}
}

function openVideo(url){
const id=getVideoId(url);
const player=document.getElementById("player");

if(id){
player.innerHTML='<iframe src="https://www.youtube.com/embed/'+id+'" allowfullscreen></iframe>';
}else{
player.innerHTML='<p>এই লিংকটি YouTube ভিডিও হিসেবে খোলা যাচ্ছে না।</p><a href="'+url+'" target="_blank">ভিডিও খুলুন</a>';
}
document.getElementById("modal").classList.add("show");
}

function closeVideo(){
document.getElementById("modal").classList.remove("show");
document.getElementById("player").innerHTML="";
}

function toggleMenu(){
document.getElementById("drawer").classList.toggle("show");
}

function toggleDark(){
document.body.classList.toggle("dark");
localStorage.setItem("sh420dark",document.body.classList.contains("dark")?"1":"0");
}

function showHome(){
document.getElementById("admin").classList.remove("show");
document.getElementById("drawer").classList.remove("show");
}

function showAdmin(){
document.getElementById("admin").classList.add("show");
document.getElementById("drawer").classList.remove("show");
}

if(localStorage.getItem("sh420dark")==="1"){
document.body.classList.add("dark");
}

const savedCoins=localStorage.getItem("sh420coins")||"0";
document.getElementById("coins").textContent=savedCoins;

if(window.Telegram&&window.Telegram.WebApp){
window.Telegram.WebApp.ready();
window.Telegram.WebApp.expand();
}

render();
</script>
</body>
</html>
